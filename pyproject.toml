[project]
name = "nanoreview"
version = "0.2.0"
description = "A lightweight personal AI assistant framework"
readme = { file = "README.md", content-type = "text/markdown" }
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
    { name = "Xubin Ren" },
    { name = "the nanobot contributors" },
]
keywords = ["ai", "agent", "chatbot"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "typer>=0.20.0,<1.0.0",
    "anthropic>=0.45.0,<1.0.0",
    "pydantic>=2.12.0,<3.0.0",
    "pydantic-settings>=2.12.0,<3.0.0",
    "websockets>=16.0,<17.0",
    "websocket-client>=1.9.0,<2.0.0",
    "httpx>=0.28.0,<1.0.0",
    "ddgs>=9.5.5,<10.0.0",
    "oauth-cli-kit>=0.1.3,<1.0.0",
    "loguru>=0.7.3,<1.0.0",
    "readability-lxml>=0.8.4,<1.0.0",
    "rich>=14.0.0,<15.0.0",
    "croniter>=6.0.0,<7.0.0",
    "prompt-toolkit>=3.0.50,<4.0.0",
    "questionary>=2.0.0,<3.0.0",
    "mcp>=1.26.0,<2.0.0",
    "json-repair>=0.57.0,<1.0.0",
    "chardet>=3.0.2,<6.0.0",
    "openai>=2.8.0",
    "tiktoken>=0.12.0,<1.0.0",
    "jinja2>=3.1.0,<4.0.0",
    "dulwich>=0.22.0,<1.0.0",
    "pyyaml>=6.0,<7.0.0",
    "pypdf>=5.0.0,<6.0.0",
    "python-docx>=1.1.0,<2.0.0",
    "openpyxl>=3.1.0,<4.0.0",
    "python-pptx>=1.0.0,<2.0.0",
    "filelock>=3.25.2",
    "boto3>=1.43.0",
    "chroma-hnswlib>=0.7.5,<0.7.6",
    "tree-sitter>=0.23.0",
]

[project.optional-dependencies]
api = ["aiohttp>=3.9.0,<4.0.0"]
lang-python = ["tree-sitter-python>=0.23.0"]
lang-js = ["tree-sitter-javascript>=0.23.0"]
lang-ts = ["tree-sitter-typescript>=0.23.0"]
lang-go = ["tree-sitter-go>=0.23.0"]
lang-rust = ["tree-sitter-rust>=0.23.0"]
lang-all = [
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
    "tree-sitter-go>=0.23.0",
    "tree-sitter-rust>=0.23.0",
]
langsmith = ["langsmith>=0.1.0"]
pdf = ["pymupdf>=1.25.0"]
review-rag-chunker = ["chonkie>=1.0.0"]
review-rag = [
    "chonkie>=1.0.0",
    "PyGithub>=2.5.0",
    "unidiff>=0.7.5",
    "GitPython>=3.1.0",
]
rag = ["qdrant-client>=1.12.0,<2.0.0"]
olostep = ["olostep>=0.1.0"]
dev = [
    "pytest>=9.0.0,<10.0.0",
    "pytest-asyncio>=1.3.0,<2.0.0",
    "aiohttp>=3.9.0,<4.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "ruff>=0.1.0",
    "pymupdf>=1.25.0",
    "tree-sitter-python>=0.23.0",
    "tree-sitter-javascript>=0.23.0",
    "tree-sitter-typescript>=0.23.0",
]

[project.scripts]
nanoreview = "nanoreview.cli.commands:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.hooks.custom]

[tool.hatch.build]
include = [
    "nanoreview/**/*.py",
    "nanoreview/templates/**/*.md",
    "nanoreview/skills/**/*.md",
    "nanoreview/skills/**/*.sh",
    "nanoreview/web/dist/**/*",
]
artifacts = ["nanoreview/web/dist/**/*"]

[tool.hatch.build.targets.wheel]
packages = ["nanoreview"]

[tool.hatch.build.targets.wheel.sources]
"nanoreview" = "nanoreview"

[tool.hatch.build.targets.sdist]
include = [
    "nanoreview/",
    "review-webui/",
    "nanoreview/web/dist/",
    "hatch_build.py",
    "README.md",
    "pyproject.toml",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W"]
ignore = ["E501"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "--import-mode=importlib"
testpaths = ["tests"]

[tool.coverage.run]
source = ["nanoreview"]
omit = ["tests/*", "**/tests/*"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "def __repr__",
    "raise NotImplementedError",
    "if __name__ == .__main__.:",
    "if TYPE_CHECKING:",
]

[dependency-groups]
dev = ["pytest-asyncio>=1.3.0"]
