  font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace;
  font-size: 12px; background: hsl(var(--muted) / 0.5); padding: 1px 4px; border-radius: 4px;
}

/* Streaming spinner */
.stream-spinner {
  display: inline-block; height: 10px; width: 10px; border-radius: 9999px;
  border: 2px solid hsl(var(--muted-foreground) / 0.4); border-top-color: hsl(var(--muted-foreground));
  animation: spin 1s linear infinite;
}
.stream-cursor {
  display: inline-block; width: 4px; height: 12px; background: hsl(var(--foreground) / 0.6);
  animation: pulse 2s cubic-bezier(0.4,0,0.6,1) infinite; margin-left: 2px; vertical-align: text-bottom; border-radius: 2px;
}

@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 50% { opacity: 0.5; } }
@keyframes fadeUp { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: translateY(0); } }

/* ========== Finding Batch (severity grouped) ========== */
.finding-batch { display: flex; flex-direction: column; gap: 8px; }
.finding-batch-header {
  display: flex; align-items: center; gap: 6px; border: none; background: none; cursor: pointer;
  font-size: 11px; color: hsl(var(--muted-foreground)); padding: 0 4px; font-family: inherit; transition: color 0.15s;
}
.finding-batch-header:hover { color: hsl(var(--foreground)); }
.finding-batch-header svg { width: 12px; height: 12px; transition: transform 0.2s ease; }
.finding-batch-header .count { font-weight: 500; }
.finding-batch-header .hint { color: hsl(var(--muted-foreground) / 0.6); }

.severity-group { border-radius: 8px; border: 1px solid; overflow: hidden; transition: all 0.15s; }
.severity-group.critical { border-color: rgb(254 202 202); background: hsl(0 96% 89% / 0.5); }
.severity-group.high { border-color: rgb(254 215 170); background: hsl(33 100% 89% / 0.5); }
.severity-group.medium { border-color: rgb(254 240 138); background: hsl(55 92% 75% / 0.5); }
.severity-group.low { border-color: rgb(191 219 254); background: hsl(217 91% 76% / 0.5); }
.dark .severity-group.critical { border-color: rgb(127 29 29); background: hsl(0 72% 30% / 0.2); }
.dark .severity-group.high { border-color: rgb(120 53 15); background: hsl(33 80% 30% / 0.2); }
.dark .severity-group.medium { border-color: rgb(113 63 18); background: hsl(55 80% 30% / 0.2); }
.dark .severity-group.low { border-color: rgb(30 58 138); background: hsl(217 80% 30% / 0.2); }

.severity-group-header {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; text-align: left;
  border: none; background: none; cursor: pointer; transition: background 0.15s; font-family: inherit;
}
.severity-group-header:hover { background: rgb(0 0 0 / 0.03); }
.dark .severity-group-header:hover { background: rgb(255 255 255 / 0.03); }
.severity-group-header svg { width: 14px; height: 14px; flex-shrink: 0; opacity: 0.7; }
.severity-group-header .sev-icon.critical { color: hsl(0 72% 51%); }
.severity-group-header .sev-icon.high { color: hsl(25 95% 53%); }
.severity-group-header .sev-icon.medium { color: hsl(45 70% 48%); }
.severity-group-header .sev-icon.low { color: hsl(217 91% 60%); }
.severity-group-header .count-label { font-size: 11px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.severity-group-header .chevron { margin-left: auto; }
.severity-group-header .chevron svg { width: 12px; height: 12px; color: hsl(var(--muted-foreground)); opacity: 1; transition: transform 0.2s ease; }

/* Severity badge */
.sev-badge {
  display: inline-flex; align-items: center; border-radius: 9999px; border: 1px solid;
  font-size: 11px; font-weight: 600; padding: 0 8px; line-height: 20px;
}
.sev-badge.critical { background: rgb(254 226 226); color: hsl(0 72% 42%); border-color: rgb(254 202 202); }
.sev-badge.high { background: rgb(255 237 213); color: hsl(25 80% 40%); border-color: rgb(254 215 170); }
.sev-badge.medium { background: rgb(254 249 195); color: hsl(45 70% 32%); border-color: rgb(254 240 138); }
.sev-badge.low { background: rgb(219 234 254); color: hsl(217 72% 40%); border-color: rgb(191 219 254); }
.dark .sev-badge.critical { background: rgb(69 10 10); color: hsl(0 72% 60%); border-color: rgb(127 29 29); }
.dark .sev-badge.high { background: rgb(67 20 7); color: hsl(25 80% 56%); border-color: rgb(120 53 15); }
.dark .sev-badge.medium { background: rgb(69 26 3); color: hsl(45 68% 50%); border-color: rgb(113 63 18); }
.dark .sev-badge.low { background: rgb(30 27 75); color: hsl(217 72% 56%); border-color: rgb(30 58 138); }

/* Finding item in batch */
.finding-items { border-top: 1px solid; border-color: inherit; }
.finding-item-btn {
  display: flex; align-items: flex-start; gap: 8px; width: 100%; text-align: left;
  border: none; background: none; cursor: pointer; padding: 8px 12px; transition: background 0.15s; font-family: inherit;
}
.finding-item-btn:hover { background: rgb(0 0 0 / 0.03); }
.dark .finding-item-btn:hover { background: rgb(255 255 255 / 0.03); }
.finding-item-btn + .finding-item-btn { border-top: 1px solid; border-color: inherit; opacity: 0.4; border-top-width: 1px; }
/* fix: border-top color should be subtle */
.finding-item-btn + .finding-item-btn { border-top-color: hsl(var(--border) / 0.4); opacity: 1; }
.finding-dot { margin-top: 4px; width: 4px; height: 4px; border-radius: 9999px; background: currentColor; opacity: 0.5; flex-shrink: 0; }
.finding-item-content { flex: 1; min-width: 0; }
.finding-item-title { font-size: 12px; font-weight: 500; color: hsl(var(--foreground)); line-height: 1.375; }
.finding-item-meta { display: flex; align-items: center; gap: 6px; margin-top: 2px; flex-wrap: wrap; }
.finding-item-loc {
  font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 10px;
  color: hsl(var(--muted-foreground)); background: hsl(var(--muted) / 0.6); padding: 0 4px; border-radius: 2px;
}
.finding-item-dim { font-size: 9px; color: hsl(var(--muted-foreground)); text-transform: capitalize; }

/* ========== Subagent Cards ========== */
.subagent-cards { display: flex; flex-direction: column; gap: 6px; }
.subagent-card {
  border-radius: 8px; border: 1px solid; background: hsl(var(--card) / 0.5);
  overflow: hidden; transition: all 0.15s;
}
.subagent-card.running { border-color: rgb(191 219 254); }
.subagent-card.completed { border-color: rgb(187 247 208); }
.subagent-card.error { border-color: rgb(254 202 202); }
.dark .subagent-card.running { border-color: rgb(30 58 138); }
.dark .subagent-card.completed { border-color: rgb(20 83 45); }
.dark .subagent-card.error { border-color: rgb(127 29 29); }

.subagent-card-header {
  display: flex; align-items: center; gap: 8px; width: 100%; padding: 8px 12px; text-align: left;
  border: none; background: none; cursor: pointer; transition: background 0.15s; font-family: inherit;
}
.subagent-card-header:hover { background: rgb(0 0 0 / 0.02); }
.dark .subagent-card-header:hover { background: rgb(255 255 255 / 0.02); }
.subagent-card-header svg { width: 14px; height: 14px; flex-shrink: 0; }
.subagent-card-header .sa-icon.running { color: hsl(217 91% 60%); animation: spin 1s linear infinite; }
.subagent-card-header .sa-icon.completed { color: hsl(142 71% 45%); }
.subagent-card-header .sa-icon.error { color: hsl(0 72% 51%); }
.subagent-label { font-size: 12px; font-weight: 500; color: hsl(var(--foreground)); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.subagent-status { font-size: 10px; color: hsl(var(--muted-foreground) / 0.7); text-transform: capitalize; }
.subagent-elapsed { font-size: 10px; color: hsl(var(--muted-foreground) / 0.7); font-variant-numeric: tabular-nums; }
.subagent-chevron { margin-left: auto; }
.subagent-chevron svg { width: 12px; height: 12px; color: hsl(var(--muted-foreground)); }

.subagent-thinking { border-top: 1px solid; border-color: inherit; opacity: 0.4; padding: 8px 12px; }
.subagent-thinking { opacity: 1; border-top-color: hsl(var(--border) / 0.4); }
.subagent-thinking-header { display: flex; align-items: center; gap: 6px; margin-bottom: 4px; }
.subagent-thinking-header svg { width: 12px; height: 12px; color: hsl(var(--muted-foreground) / 0.6); }
.subagent-thinking-label { font-size: 10px; font-weight: 500; color: hsl(var(--muted-foreground) / 0.6); }
.subagent-thinking-content {
  font-size: 11px; color: hsl(var(--muted-foreground) / 0.8); white-space: pre-wrap; word-break: break-word;
  max-height: 160px; overflow-y: auto; line-height: 1.625;
}

/* ========== Chat Input ========== */
.chat-input-area {
  display: flex; align-items: flex-end; gap: 6px; border-top: 1px solid hsl(var(--border));
  background: hsl(var(--background)); padding: 8px 12px;
}
.chat-input {
  flex: 1; resize: none; border-radius: 8px; border: 1px solid hsl(var(--input));
  background: hsl(var(--background)); padding: 8px 12px; font-size: 12px; color: hsl(var(--foreground));
  font-family: inherit; outline: none; min-height: 36px; line-height: 20px; overflow: hidden;
  transition: border-color 0.15s, box-shadow 0.15s;
}
.chat-input:focus { border-color: hsl(var(--ring)); box-shadow: 0 0 0 2px hsl(var(--ring)); }
.chat-input::placeholder { color: hsl(var(--muted-foreground) / 0.5); }
.send-btn {
  height: 32px; width: 32px; flex-shrink: 0; border-radius: 8px; border: none;
  background: hsl(var(--primary)); color: hsl(var(--primary-foreground));
  display: flex; align-items: center; justify-content: center; cursor: pointer; transition: opacity 0.15s;
}
.send-btn:hover { opacity: 0.9; }
.send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
.send-btn svg { width: 14px; height: 14px; }
.send-btn.stop { background: hsl(var(--destructive) / 0.9); }
.send-btn.stop:hover { background: hsl(var(--destructive)); }

/* ========== Code Panel ========== */
.code-panel {
  display: flex; flex-direction: column; border-radius: 12px; border: 1px solid hsl(var(--border));
  background: hsl(var(--card)); box-shadow: var(--shadow-sm); overflow: hidden; flex-shrink: 0;
}
.code-panel-header {
  display: flex; align-items: center; gap: 6px; padding: 8px 12px;
  border-bottom: 1px solid hsl(var(--border)); background: hsl(var(--muted) / 0.4);
}
.code-panel-header svg { width: 14px; height: 14px; color: hsl(var(--muted-foreground)); }
.code-panel-title { font-size: 12px; font-weight: 600; color: hsl(var(--foreground)); }
.code-panel-body { flex: 1; padding: 12px; overflow-y: auto; }
.code-empty {
  display: flex; flex-direction: column; align-items: center; justify-content: center; height: 100%;
  text-align: center; gap: 8px; padding: 40px 0;
}
.code-empty-icon { border-radius: 9999px; background: hsl(var(--muted)); padding: 12px; }
.code-empty-icon svg { width: 20px; height: 20px; color: hsl(var(--muted-foreground)); }
.code-empty-text { font-size: 12px; font-weight: 500; color: hsl(var(--muted-foreground)); }
.code-empty-hint { font-size: 11px; color: hsl(var(--muted-foreground) / 0.7); }

.code-finding-info { display: flex; align-items: center; gap: 8px; font-size: 12px; color: hsl(var(--muted-foreground)); margin-bottom: 8px; }
.code-finding-info .sep { color: hsl(var(--border)); }

/* CodeBlock */
.code-block {
  border-radius: 8px; border: 1px solid #e8e0d4; background: #faf6f0; box-shadow: var(--shadow-sm); overflow: hidden;
}
.code-block-header {
  display: flex; align-items: center; justify-content: space-between; padding: 8px 12px;
  border-bottom: 1px solid #e8e0d4; background: #f5f0e8;
}
.code-block-file { display: flex; align-items: center; gap: 6px; min-width: 0; }
.code-block-file svg { width: 14px; height: 14px; color: #8c7b6b; flex-shrink: 0; }
.code-block-name { font-size: 12px; font-weight: 500; color: #5c4f42; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.code-block-copy { border: none; background: none; cursor: pointer; color: #8c7b6b; display: flex; align-items: center; gap: 4px; font-size: 11px; }
.code-block-copy svg { width: 12px; height: 12px; }
.code-block-copy:hover { color: #5c4f42; }
.code-block-content { max-height: 400px; overflow: auto; background: #2d2a2e; padding: 12px 16px; }
.code-line { display: flex; font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, monospace; font-size: 12px; line-height: 1.5; }
.code-line.highlight { background: rgba(251, 191, 36, 0.18); border-left: 2px solid #f59e0b; }
.code-line-num { min-width: 2em; padding-right: 12px; color: #65606b; text-align: right; user-select: none; flex-shrink: 0; }
.code-line-code { color: #e8e0d4; white-space: pre; }
.tok-keyword { color: #c88ff5; }
.tok-string { color: #a6e22e; }
.tok-comment { color: #6c6c6c; font-style: italic; }
.tok-number { color: #fd971f; }
.tok-func { color: #66d9ef; }

/* ========== Report Summary ========== */
.report-summary {
  border: 2px solid hsl(var(--primary) / 0.2); border-radius: 8px; background: hsl(var(--card));
  padding: 16px;
}
.report-summary-title { display: flex; align-items: center; gap: 6px; }
.report-summary-title svg { width: 14px; height: 14px; color: hsl(var(--primary)); }
.report-summary-title h3 { font-size: 12px; font-weight: 600; color: hsl(var(--foreground)); }
.report-summary-text { font-size: 12px; color: hsl(var(--muted-foreground)); line-height: 1.625; margin-top: 8px; }
.report-summary-stats { display: flex; flex-wrap: wrap; gap: 8px; padding-top: 4px; margin-top: 8px; }
.rss-item { display: flex; align-items: center; gap: 4px; }
.rss-item svg { width: 12px; height: 12px; }
.rss-item .num { font-size: 12px; font-weight: 500; color: hsl(var(--foreground)); }
.rss-item .label { font-size: 10px; color: hsl(var(--muted-foreground)); }
.rss-item.critical svg { color: hsl(0 72% 51%); }
.rss-item.high svg { color: hsl(25 95% 53%); }
.rss-item.medium svg { color: hsl(45 70% 48%); }
.rss-item.low svg { color: hsl(217 91% 60%); }
.rss-item.total svg { color: hsl(var(--muted-foreground)); }

/* Report message (markdown in chat) */
.msg-report {
  max-width: 90%; padding: 12px 16px; background: hsl(var(--card)); border: 1px solid hsl(var(--border));
  border-radius: 8px; animation: fadeUp 0.3s ease;
}
.msg-report h2 { font-size: 14px; font-weight: 700; color: hsl(var(--foreground)); margin-bottom: 8px; }
.msg-report p { font-size: 12px; color: hsl(var(--foreground)); line-height: 1.625; }
.msg-report p + p { margin-top: 6px; }
.msg-report table { border-collapse: collapse; width: 100%; font-size: 12px; margin: 8px 0; }
.msg-report th, .msg-report td { border: 1px solid hsl(var(--border)); padding: 4px 6px; text-align: left; vertical-align: top; overflow-wrap: anywhere; }
.msg-report th { background: hsl(var(--muted) / 0.5); font-weight: 600; }
.msg-report .checks { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
.msg-report .check { display: flex; align-items: center; gap: 3px; font-size: 11px; color: hsl(var(--muted-foreground)); }
.msg-report .check svg { width: 12px; height: 12px; }
.msg-report .check.passed svg { color: hsl(142 71% 45%); }

/* Hidden */
.hidden { display: none !important; }

/* Demo controls */
.demo-controls { position: fixed; bottom: 16px; right: 16px; z-index: 60; }
.demo-btn {
  display: inline-flex; align-items: center; gap: 5px; padding: 8px 14px;
  border: 1px solid hsl(var(--border)); border-radius: 8px; background: hsl(var(--card));
  color: hsl(var(--foreground)); font-size: 12px; font-weight: 500; cursor: pointer; font-family: inherit;
  box-shadow: var(--shadow-md); transition: all 0.15s;
}
.demo-btn:hover { border-color: hsl(var(--primary) / 0.3); color: hsl(var(--primary)); }
.demo-btn svg { width: 13px; height: 13px; }

@media (max-width: 900px) {
  .right-panel { display: none !important; }
}
@media (max-width: 700px) {
  .sidebar { width: 0; opacity: 0; border-right: none; overflow: hidden; }
  .sidebar.expanded { width: 220px; opacity: 1; border-right: 1px solid hsl(var(--sidebar-border)); overflow: visible; }
}
.chat-panel { min-width: 280px; }
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
}
</style>

// ========== Form ==========
function setScope(s) {
  currentScope = s;
  document.getElementById('scopeRepo').classList.toggle('active', s==='repo');
  document.getElementById('scopeDiff').classList.toggle('active', s==='diff');
}
function setDepth(d, btn) {
  currentDepth = d;
  document.querySelectorAll('.depth-btn').forEach(b=>b.classList.remove('active'));
  btn.classList.add('active');
}
function toggleFocus(chip) { chip.classList.toggle('active'); updateSubmitState(); }
function toggleAllFocus(group, btn) {
  const chips = group === 'core'
    ? document.querySelectorAll('[data-focus="security"],[data-focus="tests"],[data-focus="bug-risk"],[data-focus="performance"]')
    : document.querySelectorAll('[data-focus="architecture"],[data-focus="maintainability"],[data-focus="dependency"]');
  const allActive = Array.from(chips).every(c => c.classList.contains('active'));
  chips.forEach(c => c.classList.toggle('active', !allActive));
  btn.classList.toggle('all', !allActive);
  btn.innerHTML = !allActive
    ? '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> All selected'
    : '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="20 6 9 17 4 12"/></svg> Select all';

  const hasFocus = document.querySelectorAll('.focus-chip.active').length > 0;

  document.getElementById('targetSubmit').disabled = !hasFocus;

function toggleSidebar() {

// JS-based responsive layout (CSS @media doesn't work in some embedded browsers)
function handleResize() {
  const w = window.innerWidth;
  const sb = document.getElementById('sidebar');
  const rp = document.getElementById('rightPanel');
  const cp = document.querySelector('.chat-panel');

  if (w <= 700) {
    // Small screen: hide sidebar by default, hide right panel
    if (!sb.classList.contains('expanded')) {
      sb.style.width = '0';
      sb.style.opacity = '0';
      sb.style.borderRight = 'none';
      sb.style.overflow = 'hidden';
    } else {
      sb.style.width = '220px';
      sb.style.opacity = '1';
      sb.style.borderRight = '1px solid hsl(var(--sidebar-border))';
      sb.style.overflow = 'visible';
    }
    rp.style.display = 'none';
    if (cp) cp.style.minWidth = '280px';
  } else if (w <= 900) {
    // Medium screen: show sidebar, hide right panel
    sb.style.width = '';
    sb.style.opacity = '';
    sb.style.borderRight = '';
    sb.style.overflow = '';
    rp.style.display = 'none';
    if (cp) cp.style.minWidth = '300px';
  } else {
    // Large screen: show everything
    sb.style.width = '';
    sb.style.opacity = '';
    sb.style.borderRight = '';
    sb.style.overflow = '';
    if (!rp.classList.contains('collapsed')) {
      rp.style.display = '';
    }
    if (cp) cp.style.minWidth = '0';
  }
}

// ========== Demo Flow ==========
function delay(ms) { return new Promise(r => setTimeout(r, ms)); }

async function startReview() {
  if (demoState === 'running') return;
  demoState = 'running';

  // --- Snapshot form inputs so subsequent UI uses the user's actual choices ---
  const targetInput = document.getElementById('targetInput');
  const target = (targetInput.value.trim() || 'github.com/example/flask-api-server');
  const targetShort = target.split('/').pop() || target;
  const scope = currentScope;
  const depth = currentDepth;
  const focusChips = document.querySelectorAll('.focus-chip.active');
  const dimensions = Array.from(focusChips).map(c => c.dataset.focus);
  const dimLabels = dimensions.length > 0
    ? dimensions
    : ['security', 'tests', 'architecture', 'performance'];

  // --- Cancel token: each run gets a unique generation number ---
  const gen = ++runGeneration;
  const cancelled = () => gen !== runGeneration;

  document.getElementById('newReviewForm').style.display = 'none';
  document.getElementById('chatThread').style.display = '';
  document.getElementById('chatInputArea').style.display = '';
  updateSessionInfoBar('running', targetShort, depth, dimLabels.length);

  // 1. User message
  await delay(200);
  if (cancelled()) return;
  appendUserMessage(target);
  await delay(700);
  if (cancelled()) return;

  // 2. Agent thinking
  const dimList = dimLabels.join(', ');
  const thinkEl = appendThinking(`分析仓库结构... 确定审查维度为 ${dimList}。制定并行审查计划，每个维度 spawn 一个专门的子代理。`);
  await delay(1800);
  if (cancelled()) return;
  thinkEl.remove();

  // 3. Agent planning message
  const depthLabel = depth.charAt(0).toUpperCase() + depth.slice(1);
  appendAgentText(`<p>我将协调一次 <span class="hl">${depthLabel}</span> 深度的多维度代码审查。</p><p>目标仓库: <code>${target}</code></p><p>审查维度: ${dimLabels.map(d => `<span class="hl">${d}</span>`).join(', ')}</p><p style="color:hsl(var(--muted-foreground));">正在生成子代理进行并行审查...</p>`);
  await delay(1000);
  if (cancelled()) return;

  // 4. Spawn subagents (only for selected dimensions)
  const activeSubagents = subagents.filter(sa => dimLabels.includes(sa.dimension));
  appendSubagentCards(activeSubagents);
  await delay(400);
  if (cancelled()) return;
  activeSubagents.forEach(sa => {
    const card = document.querySelector(`[data-subagent="${sa.label}"]`);
    if (card) startElapsedTimer(sa.label, card);
  });

  // Helper: check cancellation after each delay
  async function step(ms) {
    await delay(ms);
    return !cancelled();
  }

  // 5-8. Complete subagents in sequence
  for (const sa of activeSubagents) {
    const saFindings = sa.findings.map(id => sampleFindings.find(f => f.id === id)).filter(Boolean);
    const waitMs = sa.dimension === 'security' ? 3500 : sa.dimension === 'tests' ? 2800 : sa.dimension === 'architecture' ? 2500 : 2000;
    if (!await step(waitMs)) return;
    completeSubagent(sa.dimension);
    if (!await step(400)) return;
    if (saFindings.length > 0) {
      appendFindingBatch(sa.dimension, saFindings);
      updateFindingCounts();
    }
  }

  // 9. Barrier message
  if (!await step(800)) return;
  appendAgentText(`<p style="color:hsl(var(--muted-foreground));">所有子代理已完成审查。正在验证发现项并生成最终报告...</p>`);
  if (!await step(1500)) return;

  // 10. Final report
  appendReport(targetShort, dimLabels);
  showReportSummary();
  updateSessionInfoBar('completed', targetShort, depth, dimLabels.length);
  demoState = 'completed';
}

  // Increment cancel token so any in-flight startReview() chain stops
  runGeneration++;
  currentCodeText = '';
  demoState = 'form';
  document.getElementById('newReviewForm').style.display = '';
  document.getElementById('chatThread').style.display = 'none';

function startElapsedTimer(label, card) {
  let s = 0;
  elapsedTimers[label] = setInterval(() => {
    s++;
    const el = card.querySelector(`[data-elapsed="${label}"]`);
    if (el) el.textContent = s < 60 ? `${s}s` : `${Math.floor(s/60)}m ${s%60}s`;
  }, 1000);
}

function completeSubagent(dimension) {
  const sa = subagents.find(s => s.dimension === dimension);
  if (!sa) return;
  const label = sa.label;
  clearInterval(elapsedTimers[label]);
  const card = document.querySelector(`[data-subagent="${label}"]`);
  if (!card) return;
  card.classList.remove('running');
  card.classList.add('completed');
  const iconEl = card.querySelector('.sa-icon');
  iconEl.classList.remove('running');
  iconEl.classList.add('completed');
  iconEl.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M22 11.08V12a10 10 0 1 1-5.93-9.14"/><polyline points="22 4 12 14.01 9 11.01"/></svg>';
  card.querySelector('.subagent-status').textContent = 'completed';
  const body = document.getElementById(`sa-body-${label}`);
  if (body) {
    body.querySelector('.subagent-thinking-content').textContent =
      sa.findings.length > 0
        ? `已完成 ${dimension} 维度审查，提交了 ${sa.findings.length} 个发现项。`
        : `已完成 ${dimension} 维度审查，未发现明显问题。`;
  }
}

function toggleSubagentBody(label) {

}

  high: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>',
  medium: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>',
  low: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="16" x2="12" y2="12"/><line x1="12" y1="8" x2="12.01" y2="8"/></svg>'
};

function appendFindingBatch(dimension, findings) {
  const thread = document.getElementById('chatThread');
  const order = { critical:0, high:1, medium:2, low:3 };
  findings.sort((a,b) => order[a.severity] - order[b.severity]);

  // Group by severity
  const groups = {};
  findings.forEach(f => { if (!groups[f.severity]) groups[f.severity] = []; groups[f.severity].push(f); });
  const sortedSevs = Object.keys(groups).sort((a,b) => order[a] - order[b]);

  const batch = document.createElement('div');
  batch.className = 'finding-batch';

  // Batch header — collapsible
  const header = document.createElement('button');
  header.className = 'finding-batch-header';
  header.innerHTML = `
    <svg class="batch-chevron" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    <span class="count">${findings.length} findings</span>
    <span class="hint">— grouped by severity</span>
  `;
  batch.appendChild(header);

  const itemsContainer = document.createElement('div');
  itemsContainer.className = 'finding-batch-items';
  itemsContainer.style.display = 'flex';
  itemsContainer.style.flexDirection = 'column';
  itemsContainer.style.gap = '8px';

  // Toggle batch items visibility
  header.addEventListener('click', () => {
    const hidden = itemsContainer.style.display === 'none';
    itemsContainer.style.display = hidden ? 'flex' : 'none';
    header.querySelector('.batch-chevron').style.transform = hidden ? '' : 'rotate(-90deg)';
  });

  sortedSevs.forEach(sev => {
    const items = groups[sev];
    const group = document.createElement('div');
    group.className = `severity-group ${sev}`;

    // Severity group header — collapsible
    const groupHeader = document.createElement('button');
    groupHeader.className = 'severity-group-header';
    groupHeader.innerHTML = `
      <span class="sev-icon ${sev}">${SEV_ICONS[sev]}</span>
      <span class="sev-badge ${sev}">${sev.charAt(0).toUpperCase()+sev.slice(1)}</span>
      <span class="count-label">${items.length} ${items.length===1?'issue':'issues'}</span>
      <span class="chevron"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg></span>
    `;
    group.appendChild(groupHeader);

    const itemsDiv = document.createElement('div');
    itemsDiv.className = 'finding-items';

    // Toggle severity group items
    groupHeader.addEventListener('click', () => {
      const hidden = itemsDiv.style.display === 'none';
      itemsDiv.style.display = hidden ? '' : 'none';
      groupHeader.querySelector('.chevron svg').style.transform = hidden ? '' : 'rotate(-90deg)';
    });

    items.forEach(f => {
      const btn = document.createElement('button');
      btn.className = 'finding-item-btn';
      btn.onclick = () => showCodeContext(f);

      // Build structure with DOM API, use textContent for dynamic values
      const dot = document.createElement('div');
      dot.className = 'finding-dot';
      dot.style.color = `hsl(var(--severity-${sev}))`;

      const content = document.createElement('div');
      content.className = 'finding-item-content';

      const title = document.createElement('p');
      title.className = 'finding-item-title';
      title.textContent = f.title;

      const meta = document.createElement('div');
      meta.className = 'finding-item-meta';

      const loc = document.createElement('code');
      loc.className = 'finding-item-loc';
      loc.textContent = `${f.file}:${f.line}`;

      const dim = document.createElement('span');
      dim.className = 'finding-item-dim';
      dim.textContent = f.dimension;

      meta.appendChild(loc);
      meta.appendChild(dim);
      content.appendChild(title);
      content.appendChild(meta);
      btn.appendChild(dot);
      btn.appendChild(content);
      itemsDiv.appendChild(btn);
    });
    group.appendChild(itemsDiv);
    itemsContainer.appendChild(group);
  });

  batch.appendChild(itemsContainer);
  thread.appendChild(batch);
  scrollBottom();
}

// ========== Code Context ==========
function showCodeContext(f) {
  const body = document.getElementById('codePanelBody');

  // Extract plain-text code for clipboard (strip HTML tags from pre-baked spans)
  currentCodeText = f.code.map(line => {
    const tmp = document.createElement('div');
    tmp.innerHTML = line.c || '';
    return `${line.n}\t${tmp.textContent}`;
  }).join('\n');

  // Build DOM with textContent for dynamic values; code lines use innerHTML
  // for trusted pre-baked syntax-highlight spans
  body.innerHTML = '';
  const infoDiv = document.createElement('div');
  infoDiv.className = 'code-finding-info';
  const lineSpan = document.createElement('span');
  lineSpan.textContent = `第 ${f.line} 行`;
  const sep = document.createElement('span');
  sep.className = 'sep';
  sep.textContent = '|';
  const sevBadge = document.createElement('span');
  sevBadge.className = `sev-badge ${f.severity}`;
  sevBadge.textContent = f.severity.charAt(0).toUpperCase() + f.severity.slice(1);
  infoDiv.appendChild(lineSpan);
  infoDiv.appendChild(sep);
  infoDiv.appendChild(sevBadge);

  const codeBlock = document.createElement('div');
  codeBlock.className = 'code-block';

  const blockHeader = document.createElement('div');
  blockHeader.className = 'code-block-header';

  const fileDiv = document.createElement('div');
  fileDiv.className = 'code-block-file';
  fileDiv.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>';
  const fileName = document.createElement('span');
  fileName.className = 'code-block-name';
  fileName.textContent = f.file.split('/').pop();
  fileDiv.appendChild(fileName);

  const copyBtn = document.createElement('button');
  copyBtn.className = 'code-block-copy';
  copyBtn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
  copyBtn.onclick = () => copyCode(copyBtn);

  blockHeader.appendChild(fileDiv);
  blockHeader.appendChild(copyBtn);

  const contentDiv = document.createElement('div');
  contentDiv.className = 'code-block-content scrollbar-thin';
  contentDiv.innerHTML = f.code.map(line =>
    `<div class="code-line ${line.hl?'highlight':''}"><span class="code-line-num">${line.n}</span><span class="code-line-code">${line.c||'&nbsp;'}</span></div>`
  ).join('');

  codeBlock.appendChild(blockHeader);
  codeBlock.appendChild(contentDiv);
  body.appendChild(infoDiv);
  body.appendChild(codeBlock);
}

function copyCode(btn) {
  const setSuccess = () => {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#16a34a;"><polyline points="20 6 9 17 4 12"/></svg> Copied';
  };
  const setFail = () => {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" style="color:#dc2626;"><circle cx="12" cy="12" r="10"/><line x1="15" y1="9" x2="9" y2="15"/><line x1="9" y1="9" x2="15" y2="15"/></svg> Copy failed';
  };
  const resetBtn = () => {
    btn.innerHTML = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg> Copy';
  };

  if (!currentCodeText) { setFail(); setTimeout(resetBtn, 2000); return; }

  if (navigator.clipboard && navigator.clipboard.writeText) {
    navigator.clipboard.writeText(currentCodeText).then(() => {
      setSuccess();
      setTimeout(resetBtn, 2000);
    }).catch(() => {
      setFail();
      setTimeout(resetBtn, 2000);
    });
  } else {
    // Fallback for browsers without clipboard API (e.g. file:// without permissions)
    try {
      const ta = document.createElement('textarea');
      ta.value = currentCodeText;
      ta.style.position = 'fixed';
      ta.style.opacity = '0';
      document.body.appendChild(ta);
      ta.select();
      document.execCommand('copy');
      document.body.removeChild(ta);
      setSuccess();
    } catch {
      setFail();
    }
    setTimeout(resetBtn, 2000);
  }
}

  const isRunning = status === 'running';

  bar.innerHTML = `
    <div class="sib-target">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="6" y1="3" x2="6" y2="15"/><circle cx="18" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M18 9a9 9 0 0 1-9 9"/></svg>

    </div>
    <span class="sib-sep">|</span>
    <span class="sib-depth">${depthLabel}</span>
    <span class="sib-status-dot ${isRunning?'running':'completed'}"></span>
    <span class="sib-dimensions">${dimCount || 4}D</span>

function updateFindingCounts() {
  const counts = { critical:0, high:0, medium:0, low:0 };
  document.querySelectorAll('.finding-item-btn').forEach(btn => {
    const dot = btn.querySelector('.finding-dot');
    if (!dot) return;
    Object.keys(counts).forEach(sev => {
      if (dot.style.color.includes(`var(--severity-${sev})`)) counts[sev]++;
    });
  });
  const total = counts.critical + counts.high + counts.medium + counts.low;
  const el = document.getElementById('sibCounts');
  if (!el) return;
  if (total === 0) { el.innerHTML = ''; return; }
  el.innerHTML = `
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg>
    <span class="sib-count-total">${total}</span>
    ${counts.critical?`<span class="sib-count-badge c">${counts.critical}C</span>`:''}
    ${counts.high?`<span class="sib-count-badge h">${counts.high}H</span>`:''}
    ${counts.medium?`<span class="sib-count-badge m">${counts.medium}M</span>`:''}
    ${counts.low?`<span class="sib-count-badge l">${counts.low}L</span>`:''}
  `;
}

    <div class="rss-item total"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg><span class="num">4</span><span class="label">Total</span></div>
  `;
  document.getElementById('reportSummary').style.display = '';
}

// ========== Chat Input ==========
function sendMessage() {
  const input = document.getElementById('chatInput');
  const text = input.value.trim();
  if (!text) return;
  appendUserMessage(text);
  input.value = '';
  input.style.height = 'auto';
  setTimeout(() => {
    appendAgentText(`<p>这是一个离线演示。在真实的 nanobot 中，你的消息会通过 WebSocket 发送到 AgentLoop 处理。</p>`);
  }, 800);
}

document.getElementById('chatInput').addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); sendMessage(); }
});
document.getElementById('chatInput').addEventListener('input', function() {
  this.style.height = 'auto';
  this.style.height = Math.min(this.scrollHeight, 120) + 'px';
});

// ========== Utils ==========
function scrollBottom() {
  const thread = document.getElementById('chatThread');
  setTimeout(() => { thread.scrollTop = thread.scrollHeight; }, 50);
}

// Keyboard shortcuts
document.addEventListener('keydown', e => {
  if (e.ctrlKey && e.key === 'b') { e.preventDefault(); toggleSidebar(); }
});

// Init
updateSubmitState();
handleResize();
window.addEventListener('resize', handleResize);
</script>
